<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TMI Miriam Karvinen | Markkinointi ja ICT-palvelut</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --blue:#2083B4;
    --purple:#8A6ED1;
    --pink:#D94BDE;
    --dark:#111827;
    --text:#4B5563;
    --bg:#F7F9FC;

    --gradient:linear-gradient(
        90deg,
        #2083B4,
        #8A6ED1,
        #D94BDE
    );
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Segoe UI, sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.7;
}

.container{
    width:min(1200px,90%);
    margin:auto;
}

nav{
    position:sticky;
    top:0;
    background:white;
    border-bottom:1px solid #e5e7eb;
    z-index:100;
}

.nav-inner{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:1rem 0;
}

.logo{
    font-size:2rem;
    font-weight:700;
    background:var(--gradient);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

nav ul{
    list-style:none;
    display:flex;
    gap:2rem;
}

nav a{
    text-decoration:none;
    color:var(--dark);
    font-weight:600;
}

.hero{
    padding:5rem 0;
}

.hero-grid{
    display:grid;
    grid-template-columns:1.2fr 1fr;
    gap:4rem;
    align-items:center;
}

h1{
    font-size:clamp(3.5rem,7vw,5.5rem);
    line-height:1;
    color:var(--dark);
    margin-bottom:1.5rem;
}

.gradient{
    background:var(--gradient);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.hero p{
    font-size:1.25rem;
    margin-bottom:2rem;
}

.hero-img{
    width:100%;
    max-width:500px;
    display:block;
    margin:auto;
    border-radius:24px;
}

.btns{
    display:flex;
    gap:1rem;
    flex-wrap:wrap;
}

.btn{
    display:inline-block;
    padding:1rem 1.5rem;
    text-decoration:none;
    border-radius:999px;
    font-weight:700;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn-primary{
    background:var(--gradient);
    color:white;
}

.btn-secondary{
    background:white;
    color:var(--dark);
    border:1px solid #d1d5db;
}

.section{
    padding:5rem 0;
}

.section-title{
    text-align:center;
    margin-bottom:3rem;
}

.section-title h2{
    font-size:2.5rem;
    color:var(--dark);
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:1.5rem;
}

.card{
    background:white;
    padding:2rem;
    border-radius:24px;
    box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.card h3{
    margin-bottom:1rem;
    color:var(--dark);
}

.about,
.contact{
    background:white;
    padding:3rem;
    border-radius:24px;
    box-shadow:0 4px 20px rgba(0,0,0,.08);
}

footer{
    text-align:center;
    padding:3rem 1rem;
    color:#6b7280;
}

@media (max-width: 900px){

    .hero-grid{
        grid-template-columns:1fr;
        text-align:center;
    }

    .btns{
        justify-content:center;
    }

    nav ul{
        gap:1rem;
    }
}

</style>
</head>

<body>

<nav>
    <div class="container nav-inner">

        <div class="logo">
            Miriam Karvinen
        </div>

        <ul>
            <li><a href="#palvelut">Palvelut</a></li>
            <li><a href="#minusta">Minusta</a></li>
            <li><a href="#yhteys">Yhteys</a></li>
        </ul>

    </div>
</nav>

<section class="hero">

    <div class="container hero-grid">

        <div>

            <h1>
                Markkinointia
